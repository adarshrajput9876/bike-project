<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Wheel Adventure</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 40px; }
        .tabs { display: flex; gap: 20px; margin-bottom: 40px; }
        .tab-btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 25px; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { border-color: #D4AF37; color: #D4AF37; }
        .section { display: none; }
        .section.active { display: block; }
        .row { background: #161616; padding: 15px; border: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; border-radius: 8px; }
        .btn-del { background: #ff4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-reset { background: #D4AF37; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-view" style="text-align:center; margin-top:100px;">
        <input type="password" id="pass" placeholder="PIN" style="padding:10px;">
        <button onclick="login()" style="padding:10px;">Login</button>
    </div>

    <div id="admin-view" style="display:none;">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('history')">A. History</button>
            <button class="tab-btn" onclick="showTab('control')">B. Control Panel</button>
        </div>

        <div id="history" class="section active">
            <h2>BOOKING HISTORY</h2>
            <div id="hist-list"></div>
        </div>

        <div id="control" class="section">
            <h2>INVENTORY CONTROL</h2>
            <div id="inventory-list"></div>
        </div>
    </div>

    <script>
        function login() {
            if(document.getElementById('pass').value === "22224444") {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                loadAll();
            }
        }

        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadAll() {
            // Load History
            const hRes = await fetch('/api/admin/history');
            const hData = await hRes.json();
            document.getElementById('hist-list').innerHTML = hData.reverse().map(h => `
                <div class="row">
                    <div><b>${h.customerName}</b> - ${h.bikeName} (₹${h.totalPrice})</div>
                    <button class="btn-del" onclick="delHist(${h.id})">DELETE</button>
                </div>
            `).join('');

            // Load Inventory
            const bRes = await fetch('/api/bikes');
            const bData = await bRes.json();
            document.getElementById('inventory-list').innerHTML = bData.map(b => `
                <div class="row">
                    <div>${b.name} | Total: ${b.stock} | On Rent: ${b.rented}</div>
                    <button class="btn-reset" onclick="resetBike(${b.id})">RESET STOCK</button>
                </div>
            `).join('');
        }

        async function delHist(id) {
            if(confirm("Delete this record?")) {
                await fetch(`/api/admin/history/${id}`, { method: 'DELETE' });
                loadAll();
            }
        }

        async function resetBike(id) {
            await fetch('/api/admin/reset-bike', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bikeId: id })
            });
            loadAll();
        }
    </script>
</body>
</html>
