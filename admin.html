<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Auth | Wheel Adventure</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #161616; padding: 40px; border-radius: 20px; border: 1px solid #D4AF37; text-align: center; }
        input { padding: 12px; width: 200px; margin-bottom: 20px; background: #222; border: 1px solid #444; color: #fff; text-align: center; font-size: 1.2rem; }
        .admin-content { display: none; width: 90%; max-width: 800px; }
        .row { background: #161616; padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="auth-view" class="auth-card">
        <h2 style="color:#D4AF37">ADMIN ACCESS</h2>
        <input type="password" id="admin-pass" placeholder="ENTER PIN">
        <br>
        <button onclick="checkPass()" style="background:#D4AF37; padding:10px 30px; border:none; cursor:pointer; font-weight:bold;">LOGIN</button>
    </div>

    <div id="admin-view" class="admin-content">
        <h1>ALIGARH HUB HISTORY</h1>
        <div id="history-list"></div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "22224444") {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                loadHistory();
            } else {
                alert("ACCESS DENIED: Incorrect Password");
            }
        }

        async function loadHistory() {
            const res = await fetch('/api/admin/history');
            const data = await res.json();
            const list = document.getElementById('history-list');
            list.innerHTML = data.reverse().map(h => `
                <div class="row">
                    <div><b>${h.customerName}</b><br><small>${h.bikeName} | ${h.phone}</small></div>
                    <div style="color:#D4AF37">₹${h.totalPrice}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
