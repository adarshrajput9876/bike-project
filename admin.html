<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Hub | Wheel Adventure</title>
    <style>
        :root { 
            --primary: #2c5530; 
            --gold: #D4AF37; 
            --dark: #0a1a0f; 
            --surface: #121a14;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* Administrator Login Gateway */
        #auth-gateway { 
            text-align: center; 
            background: var(--surface); 
            padding: 40px; 
            border-radius: 12px; 
            border-top: 5px solid var(--gold); 
            border-bottom: 5px solid var(--primary); 
            box-shadow: 0 0 40px rgba(0,0,0,0.5); 
            width: 350px;
        }

        input[type="password"] { 
            padding: 15px; 
            background: #1a2a1f; 
            border: 1px solid var(--primary); 
            color: var(--gold); 
            text-align: center; 
            font-size: 1.5rem; 
            margin-bottom: 20px; 
            width: 100%; 
            border-radius: 8px; 
            letter-spacing: 5px;
        }

        /* Main Dashboard View */
        #admin-dash { 
            display: none; 
            width: 95%; 
            max-width: 1100px; 
            height: 90vh; 
            background: var(--surface); 
            border-radius: 15px; 
            flex-direction: column; 
            overflow: hidden; 
            border: 1px solid var(--primary); 
        }

        .dash-header { 
            background: var(--primary); 
            padding: 20px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            background: #000;
        }

        .stat-card {
            background: #1a2a1f;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--gold);
        }

        .stat-card small { color: #888; font-size: 0.7rem; text-transform: uppercase; }
        .stat-card h2 { color: var(--gold); margin-top: 5px; }

        .tabs { display: flex; background: #000; border-bottom: 1px solid #222; }
        .tab-btn { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            background: none; 
            color: #666; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            border-bottom: 3px solid transparent; 
            transition: 0.3s; 
        }
        .tab-btn.active { 
            color: var(--gold); 
            border-bottom-color: var(--gold); 
            background: #0c1a11; 
        }
        
        .content { flex: 1; overflow-y: auto; padding: 25px; }
        
        /* List Rows */
        .record-row { 
            background: #1a2a1f; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #223a2b; 
        }

        .record-info b { font-size: 1.1rem; color: #fff; }
        .record-info p { font-size: 0.85rem; color: #888; margin-top: 5px; }
        
        .btn-action { 
            padding: 10px 18px; 
            border-radius: 6px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.8rem;
        }
        
        .btn-del { background: #441111; color: #ff4444; border: 1px solid #662222; }
        .btn-reset { background: var(--gold); color: #000; }
        .view-proof { color: var(--gold); text-decoration: underline; font-size: 0.8rem; margin-right: 15px; }
    </style>
</head>
<body>

    <div id="auth-gateway">
        <h1 style="font-size:1.1rem; color:var(--gold); letter-spacing:3px; margin-bottom:30px;">ADMINISTRATOR GATEWAY</h1>
        <input type="password" id="pin-input" placeholder="••••">
        <button onclick="attemptLogin()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Verify Identity</button>
        <p id="err" style="color:red; font-size:0.7rem; margin-top:15px; display:none;">ACCESS DENIED: INVALID PIN</p>
    </div>

    <div id="admin-dash">
        <div class="dash-header">
            <h2 style="color:var(--gold); letter-spacing:2px; font-size:1.2rem;">WHEEL ADVENTURE CONTROL HUB</h2>
            <button onclick="location.reload()" style="background:none; color:#aaa; border:none; cursor:pointer; font-size:0.8rem;">LOGOUT</button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <small>Total Revenue</small>
                <h2 id="stat-rev">₹0</h2>
            </div>
            <div class="stat-card">
                <small>Total Bookings</small>
                <h2 id="stat-count">0</h2>
            </div>
        </div>

        <div class="tabs">
            <button id="tab-h" class="tab-btn active" onclick="switchTab('history')">A. Booking History</button>
            <button id="tab-i" class="tab-btn" onclick="switchTab('inventory')">B. Inventory Control</button>
        </div>

        <div id="history-sec" class="content">
            </div>

        <div id="inventory-sec" class="content" style="display:none;">
            </div>
    </div>

    <script>
        const ADMIN_PIN = "22224444"; // cite: 11

        function attemptLogin() {
            const val = document.getElementById('pin-input').value;
            if(val === ADMIN_PIN) {
                document.getElementById('auth-gateway').style.display = 'none';
                document.getElementById('admin-dash').style.display = 'flex';
                refreshData();
            } else {
                document.getElementById('err').style.display = 'block';
                setTimeout(() => document.getElementById('err').style.display = 'none', 2000);
            }
        }

        function switchTab(type) {
            document.getElementById('history-sec').style.display = (type === 'history') ? 'block' : 'none';
            document.getElementById('inventory-sec').style.display = (type === 'inventory') ? 'block' : 'none';
            document.getElementById('tab-h').classList.toggle('active', type === 'history');
            document.getElementById('tab-i').classList.toggle('active', type === 'inventory');
        }

        async function refreshData() {
            // 1. Fetch History & Update Revenue
            const hRes = await fetch('/api/admin/history');
            const history = await hRes.json();
            let revenue = 0;

            document.getElementById('history-sec').innerHTML = history.reverse().map(h => {
                revenue += parseFloat(h.totalPrice);
                return `
                <div class="record-row">
                    <div class="record-info">
                        <b>${h.customerName}</b><br>
                        <p>${h.bikeName} | Days: ${h.days} | Total: ₹${h.totalPrice}</p>
                        <p style="color:var(--gold); font-weight:bold; margin-top:5px;">UTR: ${h.transactionId}</p>
                    </div>
                    <div style="display:flex; align-items:center;">
                        ${h.proofImage ? `<a href="/uploads/${h.proofImage}" target="_blank" class="view-proof">View Screenshot</a>` : ''}
                        <button class="btn-action btn-del" onclick="deleteHistory(${h.id})">DELETE</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('stat-rev').innerText = `₹${revenue}`;
            document.getElementById('stat-count').innerText = history.length;

            // 2. Fetch Inventory & Stock Levels
            const bRes = await fetch('/api/bikes');
            const bikes = await bRes.json();
            document.getElementById('inventory-sec').innerHTML = bikes.map(b => `
                <div class="record-row">
                    <div class="record-info">
                        <b>${b.name}</b><br>
                        <p>Total Stock: ${b.stock} | Currently Rented: <span style="color:var(--gold)">${b.rented}</span></p>
                    </div>
                    <button class="btn-action btn-reset" onclick="resetBike(${b.id})">RESET STOCK</button>
                </div>
            `).join('');
        }

        async function deleteHistory(id) {
            if(confirm("Permanently delete this booking record?")) {
                await fetch(`/api/admin/history/${id}`, { method: 'DELETE' });
                refreshData();
            }
        }

        async function resetBike(id) {
            if(confirm("Mark all units of this bike as returned to stock?")) {
                await fetch('/api/admin/reset-bike', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ bikeId: id })
                });
                refreshData();
            }
        }
    </script>
</body>
</html>
