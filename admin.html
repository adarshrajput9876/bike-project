<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wheel Adventure | Admin Hub</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; }
        .row { background: #161616; padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; }
        .status-pending { background: #d4af37; color: #000; }
        .status-active { background: #25d366; color: #fff; }
        .btn { border: none; padding: 8px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Aligarh Hub Admin</h1>
    <div id="booking-list"></div>

    <script>
        async function loadHistory() {
            const res = await fetch('/api/admin/history');
            const history = await res.json();
            const list = document.getElementById('booking-list');
            
            list.innerHTML = history.map(h => `
                <div class="row">
                    <div>
                        <strong>${h.customerName}</strong> (${h.phone})<br>
                        <small>${h.bikeName} | ${h.days} Days | <b>₹${h.totalPrice}</b></small>
                    </div>
                    <div>
                        <span class="badge ${h.status.includes('Reserved') ? 'status-pending' : 'status-active'}">${h.status}</span>
                        <button class="btn" style="background: #25d366" onclick="update('${h.id}', 'Bike Handed Over (Active)')">GIVE BIKE</button>
                        <button class="btn" style="background: #ff4444; color:white;" onclick="update('${h.id}', 'Returned')">RETURNED</button>
                    </div>
                </div>
            `).join('');
        }

        async function update(id, status) {
            await fetch('/api/admin/update-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: parseInt(id), newStatus: status })
            });
            loadHistory();
        }

        loadHistory();
    </script>
</body>
</html>
