<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Two Wheel Adventure</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .card { background: #161616; border: 1px solid #D4AF37; padding: 20px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .gold { color: #D4AF37; }
        .btn { background: #D4AF37; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1 class="gold">ALIGARH HUB ADMIN</h1>
    <input type="password" id="pin" placeholder="Enter Admin PIN">
    <button class="btn" onclick="resetInventory(null, true)">RESET ALL BIKES</button>
    <hr style="border: 0.5px solid #333; margin: 30px 0;">
    <div id="admin-list"></div>

    <script>
        async function loadAdminFleet() {
            const res = await fetch('/api/bikes');
            const data = await res.json();
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            data.forEach(v => {
                list.innerHTML += `
                    <div class="card">
                        <div>
                            <strong>${v.name}</strong><br>
                            Status: <span class="gold">${v.rented} / ${v.stock} Rented</span>
                        </div>
                        <button class="btn" onclick="resetInventory(${v.id}, false)">Mark Returned</button>
                    </div>`;
            });
        }

        async function resetInventory(bikeId, resetAll) {
            const pin = document.getElementById('pin').value;
            const res = await fetch('/api/admin/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin, bikeId, resetAll })
            });
            const result = await res.json();
            if(result.success) {
                alert(result.message);
                loadAdminFleet();
            } else {
                alert("Access Denied: " + result.message);
            }
        }
        loadAdminFleet();
    </script>
</body>
</html>
