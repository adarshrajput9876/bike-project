<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Administrator Hub | Wheel Adventure</title>
    <style>
        :root { --primary: #2c5530; --gold: #D4AF37; --dark: #0a1a0f; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #auth-gateway { text-align: center; background: #121a14; padding: 40px; border-radius: 12px; border-top: 5px solid var(--gold); }
        input { padding: 12px; background: #1a2a1f; border: 1px solid var(--primary); color: var(--gold); text-align: center; width: 100%; margin-bottom: 20px; }
        
        #admin-dash { display: none; width: 95%; max-width: 1000px; height: 90vh; background: #121a14; border-radius: 15px; flex-direction: column; overflow: hidden; }
        .tabs { display: flex; background: #000; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #555; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .row { background: #1a2a1f; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #223a2b; }
        .btn-action { padding: 8px 15px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.75rem; margin-left: 5px; }
        .btn-approve { background: #2ecc71; color: #fff; }
        .btn-reject { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>

    <div id="auth-gateway">
        <h2 style="color:var(--gold)">ALIGARH HUB LOGIN</h2>
        <input type="password" id="pin" placeholder="Enter PIN">
        <button onclick="login()" style="width:100%; padding:12px; background:var(--primary); color:#fff; border:none; cursor:pointer;">VERIFY</button>
    </div>

    <div id="admin-dash">
        <div class="tabs">
            <button id="t-req" class="tab-btn active" onclick="showTab('requests')">REQUEST FOR BIKES</button>
            <button id="t-hist" class="tab-btn" onclick="showTab('history')">RESERVED HISTORY</button>
            <button id="t-inv" class="tab-btn" onclick="showTab('inventory')">INVENTORY</button>
        </div>
        <div id="request-sec" class="content"></div>
        <div id="history-sec" class="content" style="display:none;"></div>
        <div id="inventory-sec" class="content" style="display:none;"></div>
    </div>

    <script>
        function login() { if(document.getElementById('pin').value === "22224444") { document.getElementById('auth-gateway').style.display='none'; document.getElementById('admin-dash').style.display='flex'; loadAll(); } }
        
        function showTab(t) {
            document.querySelectorAll('.content').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t + '-sec').style.display = 'block';
            document.getElementById('t-' + t.substring(0,3)).classList.add('active');
        }

        async function loadAll() {
            // Load Requests
            const rRes = await fetch('/api/admin/requests'); const reqs = await rRes.json();
            document.getElementById('request-sec').innerHTML = reqs.map(r => `
                <div class="row">
                    <div><b>${r.bikeName}</b> (UTR: ${r.transactionId})<br><small>Client: ${r.customerName}</small></div>
                    <div>
                        <button class="btn-action btn-approve" onclick="approve(${r.id})">RESERVE</button>
                        <button class="btn-action btn-reject" onclick="reject(${r.id})">REJECT</button>
                    </div>
                </div>
            `).join('');

            // Load Inventory
            const bRes = await fetch('/api/bikes'); const bikes = await bRes.json();
            document.getElementById('inventory-sec').innerHTML = bikes.map(b => `
                <div class="row">
                    <div><b>${b.name}</b><br><small>Stock: ${b.stock - b.rented}/${b.stock} Available</small></div>
                    <button class="btn-action" style="background:var(--gold)" onclick="resetB(${b.id})">RESET</button>
                </div>
            `).join('');
        }

        async function approve(id) {
            const res = await fetch('/api/admin/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({requestId: id}) });
            if(res.ok) { alert("Reserved Successfully!"); loadAll(); }
            else { const d = await res.json(); alert(d.message); }
        }

        async function reject(id) {
            await fetch('/api/admin/reject', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({requestId: id}) });
            loadAll();
        }

        async function resetB(id) { await fetch('/api/admin/reset-bike', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({bikeId:id}) }); loadAll(); }
    </script>
</body>
</html>
