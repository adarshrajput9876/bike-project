<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | Wheel Adventure</title>
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; --surface: #121212; --error: #ff4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* Login Gateway Screen */
        #auth-gateway { text-align: center; width: 100%; max-width: 400px; padding: 40px; background: var(--surface); border: 1px solid #222; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); border-top: 4px solid var(--gold); transition: 0.5s; }
        .lock-icon { font-size: 3rem; color: var(--gold); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 30px; color: #888; text-transform: uppercase; }
        input[type="password"] { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: var(--gold); text-align: center; font-size: 1.5rem; letter-spacing: 10px; margin-bottom: 20px; outline: none; transition: 0.3s; }
        input[type="password"]:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .login-btn { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

        /* Dashboard View */
        #admin-dashboard { display: none; width: 95%; max-width: 1000px; height: 90vh; background: var(--surface); border: 1px solid #222; border-radius: 15px; flex-direction: column; overflow: hidden; }
        .dash-header { padding: 25px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .stats-bar { display: flex; gap: 20px; padding: 20px; background: #1a1a1a; border-bottom: 1px solid #222; }
        .stat-box { flex: 1; padding: 15px; border-radius: 10px; border-left: 3px solid var(--gold); background: #111; }
        .stat-box small { color: #666; font-size: 0.7rem; text-transform: uppercase; }
        .stat-box h2 { color: var(--gold); font-size: 1.4rem; }

        .tabs { display: flex; background: #000; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #555; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); background: #0a0a0a; }

        .content-area { flex: 1; overflow-y: auto; padding: 20px; }
        .item-row { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .btn-action { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .btn-del { background: #331111; color: #ff4444; border: 1px solid #442222; }
        .btn-reset { background: #113311; color: #25d366; border: 1px solid #224422; }
    </style>
</head>
<body>

    <div id="auth-gateway">
        <div class="lock-icon">🔒</div>
        <h1>Administrator Gateway</h1>
        <input type="password" id="pin-input" placeholder="••••••••" maxlength="8">
        <button class="login-btn" onclick="attemptLogin()">Verify Identity</button>
        <p id="error-msg" style="color:var(--error); margin-top:15px; font-size:0.8rem; display:none;">ACCESS DENIED: INVALID CREDENTIALS</p>
    </div>

    <div id="admin-dashboard">
        <div class="dash-header">
            <h2 style="color:var(--gold); letter-spacing:2px;">WHEEL ADVENTURE CONTROL HUB</h2>
            <button onclick="location.reload()" style="background:none; color:#666; border:none; cursor:pointer;">LOGOUT</button>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <small>Total Revenue</small>
                <h2 id="total-revenue">₹0</h2>
            </div>
            <div class="stat-box">
                <small>Total Bookings</small>
                <h2 id="total-bookings">0</h2>
            </div>
        </div>

        <div class="tabs">
            <button id="tab-h" class="tab-btn active" onclick="switchTab('history')">A. BOOKING HISTORY</button>
            <button id="tab-c" class="tab-btn" onclick="switchTab('control')">B. INVENTORY CONTROL</button>
        </div>

        <div id="history-sec" class="content-area"></div>
        <div id="control-sec" class="content-area" style="display:none;"></div>
    </div>

    <script>
        const MASTER_PIN = "22224444";

        function attemptLogin() {
            const pin = document.getElementById('pin-input').value;
            if(pin === MASTER_PIN) {
                document.getElementById('auth-gateway').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-gateway').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'flex';
                    loadAdminData();
                }, 500);
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                setTimeout(() => { err.style.display = 'none'; }, 2000);
            }
        }

        function switchTab(tab) {
            document.getElementById('history-sec').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('control-sec').style.display = tab === 'control' ? 'block' : 'none';
            document.getElementById('tab-h').classList.toggle('active', tab === 'history');
            document.getElementById('tab-c').classList.toggle('active', tab === 'control');
        }

        async function loadAdminData() {
            // Load History
            const hRes = await fetch('/api/admin/history');
            const history = await hRes.json();
            
            let revenue = 0;
            const hList = document.getElementById('history-sec');
            hList.innerHTML = history.reverse().map(h => {
                revenue += h.totalPrice;
                return `
                <div class="item-row">
                    <div>
                        <strong style="color:var(--gold)">${h.customerName}</strong><br>
                        <small style="color:#666">${h.bikeName} | ${h.date}</small>
                    </div>
                    <div>
                        <span style="margin-right:20px; font-weight:bold;">₹${h.totalPrice}</span>
                        <button class="btn-action btn-del" onclick="deleteRecord(${h.id})">DELETE</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('total-revenue').innerText = `₹${revenue}`;
            document.getElementById('total-bookings').innerText = history.length;

            // Load Inventory
            const bRes = await fetch('/api/bikes');
            const bikes = await bRes.json();
            const cList = document.getElementById('control-sec');
            cList.innerHTML = bikes.map(b => `
                <div class="item-row">
                    <div>
                        <strong>${b.name}</strong><br>
                        <small style="color:#666">Stock: ${b.stock} | Currently Rented: ${b.rented}</small>
                    </div>
                    <button class="btn-action btn-reset" onclick="resetStock(${b.id})">RESET STOCK</button>
                </div>
            `).join('');
        }

        async function deleteRecord(id) {
            if(confirm("Permanently delete this entry?")) {
                await fetch(`/api/admin/history/${id}`, { method: 'DELETE' });
                loadAdminData();
            }
        }

        async function resetStock(id) {
            if(confirm("Mark all units of this bike as returned?")) {
                await fetch('/api/admin/reset-bike', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ bikeId: id })
                });
                loadAdminData();
            }
        }
    </script>
</body>
</html>
