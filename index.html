<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Adventure | Aligarh</title>
    <style>
        :root { --bg: #0a0a0a; --gold: #D4AF37; --text: #f8f9fa; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        body::before { content:""; position:fixed; inset:0; background:url('image_0.png') center/cover; filter:blur(15px); opacity:0.2; z-index:-1; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        nav { padding:40px 0; text-align:center; }
        .logo { font-size:2rem; color:var(--gold); font-weight:800; text-transform:uppercase; text-decoration:none; letter-spacing:3px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:25px; margin-bottom:50px; }
        .card { background:rgba(22,22,22,0.9); border:1px solid rgba(212,175,55,0.1); border-radius:12px; overflow:hidden; }
        .card img { width:100%; height:200px; object-fit:cover; border-bottom:2px solid var(--gold); }
        .p-20 { padding:20px; }
        .btn { background:var(--gold); color:#000; border:none; padding:14px; width:100%; font-weight:bold; border-radius:6px; cursor:pointer; text-transform:uppercase; text-align:center; text-decoration:none; display:block; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal-box { background:#111; border:2px solid var(--gold); padding:40px; border-radius:20px; text-align:center; width:90%; max-width:400px; }
        .wa-float { position:fixed; bottom:30px; right:30px; background:#25d366; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>
    <div id="modal" class="modal"><div class="modal-box" id="modal-content"></div></div>
    <div class="container">
        <nav><a href="/" class="logo">Wheel Adventure</a></nav>
        <div id="home">
            <h2 style="border-left:4px solid var(--gold); padding-left:15px; margin-bottom:20px;">OUR FLEET</h2>
            <div id="fleet-grid" class="grid"></div>
        </div>
        <div id="booking" style="display:none; max-width:600px; margin:0 auto; text-align:center;">
            <h1 id="sel-name" style="color:var(--gold); font-size:3rem; margin-bottom:20px;">Bike</h1>
            <div style="background:#161616; padding:30px; border-radius:15px; margin-bottom:20px;">
                <p>Deposit: ₹1,500 | Helmet: ₹50/day</p>
                <p>Required: DL & Aadhar Card</p>
            </div>
            <button class="btn" onclick="confirmBooking()">CONFIRM RESERVATION</button>
            <button onclick="location.reload()" style="background:none; border:none; color:var(--gold); margin-top:20px; cursor:pointer;">← BACK</button>
        </div>
    </div>
    <a href="https://wa.me/919258395352" class="wa-float" target="_blank">
        <svg style="width:35px; height:35px; fill:white;" viewBox="0 0 24 24"><path d="M12.031 6.172c-2.203 0-4.007 1.797-4.007 3.991 0 .633.148 1.258.438 1.828l-1.016 3.719 3.82-1.001c.539.289 1.141.438 1.758.438 2.211 0 4.016-1.797 4.016-4s-1.805-3.975-4.009-3.975zm.016 7.242c-.516 0-1.031-.141-1.484-.406l-.219-.125-2.234.586.594-2.172-.141-.227c-.258-.43-.391-.914-.391-1.406 0-1.508 1.227-2.734 2.734-2.734 1.516 0 2.742 1.227 2.742 2.734 0 1.516-1.226 2.75-2.6 2.75zM12 2C6.477 2 2 6.477 2 12c0 1.891.531 3.656 1.445 5.164L2 22l4.984-1.312C8.398 21.539 10.125 22 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
    </a>
    <script>
        let selectedBike = "";
        async function load() {
            const res = await fetch('/api/bikes');
            const data = await res.json();
            const grid = document.getElementById('fleet-grid');
            grid.innerHTML = '';
            data.forEach(v => {
                const avail = v.stock - v.rented;
                grid.innerHTML += `<div class="card"><img src="${v.img}"><div class="p-20"><h3>${v.name}</h3><p style="color:var(--gold); margin:10px 0;">₹${v.price}/day • ${avail > 0 ? avail + ' left' : 'OUT'}</p>${avail > 0 ? `<button class="btn" onclick="openBooking('${v.name}')">Rent</button>` : `<button class="btn" style="background:#333; cursor:not-allowed;">Rented</button>`}</div></div>`;
            });
        }
        function openBooking(n) { selectedBike = n; document.getElementById('home').style.display='none'; document.getElementById('booking').style.display='block'; document.getElementById('sel-name').innerText=n; }
       async function confirmBooking() {
    console.log("Button clicked, starting fetch...");
    const res = await fetch('/api/book', { // Use a relative path, NO localhost
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bikeName: selectedBike })
    });
    
    const result = await res.json();
    if (result.success) {
        // Show success modal...
    }
}
        load();
    </script>
</body>
</html>
