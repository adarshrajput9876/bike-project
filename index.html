<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Adventure | Aligarh Hub</title>
    <style>
        :root { --bg: #0a0a0a; --surface: #161616; --gold: #D4AF37; --text: #f8f9fa; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        body::before { content:""; position:fixed; inset:0; background:url('image_0.png') center/cover; filter:blur(15px); opacity:0.2; z-index:-1; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        nav { padding:40px 0; text-align:center; }
        .logo { font-size:2rem; color:var(--gold); font-weight:800; text-transform:uppercase; text-decoration:none; letter-spacing:3px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:25px; margin:40px 0; }
        .card { background:var(--surface); border:1px solid rgba(212,175,55,0.1); border-radius:12px; overflow:hidden; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .card img { width:100%; height:200px; object-fit:cover; border-bottom:2px solid var(--gold); }
        .p-20 { padding:20px; }
        .btn { background:var(--gold); color:#000; border:none; padding:14px; width:100%; font-weight:bold; border-radius:6px; cursor:pointer; text-transform:uppercase; text-align:center; text-decoration:none; display:block; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal-box { background:#111; border:2px solid var(--gold); padding:40px; border-radius:20px; text-align:center; width:90%; max-width:400px; }
    </style>
</head>
<body>
    <div id="modal" class="modal"><div class="modal-box" id="modal-content"></div></div>
    <div class="container">
        <nav><a href="/" class="logo">Wheel Adventure</a></nav>
        <div id="home-view">
            <h2 style="border-left:4px solid var(--gold); padding-left:15px;">ALIGARH FLEET</h2>
            <div id="fleet-grid" class="grid"></div>
        </div>
        <div id="booking-view" style="display:none; max-width:500px; margin:0 auto; text-align:center;">
            <h1 id="sel-name" style="color:var(--gold); font-size:2.5rem; margin-bottom:20px;">Bike</h1>
            <div style="background:#161616; padding:30px; border-radius:15px; margin-bottom:20px; text-align:left;">
                <p>• Security Deposit: ₹1,500</p>
                <p>• Required: Aadhar & DL</p>
            </div>
            <button class="btn" onclick="confirmBooking()">CONFIRM BOOKING</button>
            <p onclick="location.reload()" style="margin-top:20px; color:var(--gold); cursor:pointer;">← BACK TO LIST</p>
        </div>
    </div>
    <script>
        let currentBike = "";
        async function loadFleet() {
            const res = await fetch('/api/bikes');
            const bikes = await res.json();
            const grid = document.getElementById('fleet-grid');
            grid.innerHTML = '';
            bikes.forEach(b => {
                const available = b.stock - b.rented;
                grid.innerHTML += `
                    <div class="card" style="opacity: ${available > 0 ? 1 : 0.5}">
                        <img src="${b.img}">
                        <div class="p-20">
                            <h3>${b.name}</h3>
                            <p style="color:var(--gold); margin:10px 0;">₹${b.price}/day • ${available > 0 ? available + ' units left' : 'RENTED'}</p>
                            ${available > 0 ? `<button class="btn" onclick="openBooking('${b.name}')">RENT NOW</button>` : `<button class="btn" style="background:#333; cursor:not-allowed;">OUT OF STOCK</button>`}
                        </div>
                    </div>`;
            });
        }
        function openBooking(name) {
            currentBike = name;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('booking-view').style.display = 'block';
            document.getElementById('sel-name').innerText = name;
        }
        async function confirmBooking() {
            try {
                const res = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bikeName: currentBike })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('modal-content').innerHTML = `<h2>BOOKED!</h2><p>Discord notification sent to Adarsh.</p><button class="btn" style="margin-top:20px" onclick="location.reload()">OK</button>`;
                    document.getElementById('modal').style.display = 'flex';
                } else { alert("Booking failed. Please try again."); }
            } catch (e) { alert("Network Error. Check your connection!"); }
        }
        loadFleet();
    </script>
</body>
</html>
