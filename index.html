<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Adventure | Aligarh Hub</title>
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .logo { color: var(--gold); text-align: center; font-size: 2.5rem; margin: 40px 0; letter-spacing: 4px; }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #161616; border: 1px solid #333; border-radius: 12px; overflow: hidden; padding: 15px; }
        .btn { background: var(--gold); color: #000; width: 100%; padding: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Loader */
        #loader-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        footer { margin-top: 50px; border-top: 1px solid #333; padding: 40px 0; text-align: center; color: #777; }
        .wa-float { position: fixed; bottom: 20px; right: 20px; background: #25d366; padding: 15px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--gold); letter-spacing: 2px;">PROCESSING RESERVATION...</p>
    </div>

    <div class="container">
        <h1 class="logo">WHEEL ADVENTURE</h1>
        
        <div id="home-view">
            <div id="fleet-grid" class="grid"></div>
        </div>

        <div id="booking-view" style="display:none; text-align: center;">
            <h2 id="sel-bike" style="color:var(--gold)"></h2>
            <div style="background:#161616; padding: 30px; border-radius: 15px; max-width: 400px; margin: 0 auto;">
                <input type="text" id="cust-name" placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="text" id="cust-phone" placeholder="Phone Number" style="width:100%; padding:10px; margin-bottom:10px;">
                <select id="rent-days" style="width:100%; padding:10px; margin-bottom:10px;">
                    <option value="1">1 Day</option><option value="2">2 Days</option><option value="3">3 Days</option>
                </select>
                <p style="font-size: 0.8rem; color: #777;">*Includes Helmet Charge (₹50/day)</p>
                <button class="btn" onclick="startBookingProcess()">CONFIRM NOW</button>
            </div>
        </div>

        <footer>
            <p><b>Co-Founders:</b></p>
            <p>Girish Rajput: +91 9258395352 | Himanshu: +91 8218173620</p>
            <p style="margin-top: 10px;">© 2026 Aligarh Hub</p>
        </footer>
    </div>

    <a href="https://wa.me/919258395352" class="wa-float" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="30">
    </a>

    <script>
        let selectedBike = null;

        async function loadBikes() {
            const res = await fetch('/api/bikes');
            const data = await res.json();
            const grid = document.getElementById('fleet-grid');
            grid.innerHTML = data.map(b => `
                <div class="card">
                    <h3>${b.name}</h3>
                    <p>₹${b.price}/day</p>
                    <button class="btn" onclick="openBooking('${b.name}')">RENT NOW</button>
                </div>
            `).join('');
        }

        function openBooking(name) {
            selectedBike = name;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('booking-view').style.display = 'block';
            document.getElementById('sel-bike').innerText = "Booking " + name;
        }

        function startBookingProcess() {
            document.getElementById('loader-overlay').style.display = 'flex';
            
            // THE 4-SECOND WAIT
            setTimeout(async () => {
                const name = document.getElementById('cust-name').value;
                const phone = document.getElementById('cust-phone').value;
                const days = document.getElementById('rent-days').value;

                const res = await fetch('/api/book', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ bikeName: selectedBike, customerName: name, phone, days })
                });

                document.getElementById('loader-overlay').style.display = 'none';
                if (res.ok) {
                    alert("BOOKING SUCCESSFUL! Adarsh has been notified.");
                    location.reload();
                }
            }, 4000);
        }

        loadBikes();
    </script>
</body>
</html>
